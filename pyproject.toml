[project]
name = "tissreg"
version = "0.1.0"
description = "Fast headless TISS (TU Wien) registration for LVAs, groups and exams"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "lxml>=5.0"]

[project.scripts]
tissreg = "tissreg.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["tissreg"]
