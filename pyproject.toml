[project]
name = "tiss-quantum-registration"
version = "0.1.0"
description = "TISS Quantum Registration - fast headless TISS (TU Wien) registration for LVAs, groups and exams"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "lxml>=5.0"]

[project.scripts]
tissqr = "tissqr.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["tissqr"]
