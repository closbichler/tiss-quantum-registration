# Copy to config.toml (git-ignored) and adjust. Then: tissqr check

type = "group"            # course | group | exam  (course = "LVA-Anmeldung")
course = "185.A91"        # course number, with or without dot
semester = "2026W"
name = "Gruppe 002"       # group: exact group name | exam: text (regex) in the exam's header, e.g. its date
                          # (not needed for type = "course")

# Opening time (Vienna). Leave out to use the start shown on TISS ("Beginn der Anmeldung").
# start = 2026-10-12T10:00:00

# --- only if needed ---------------------------------------------------------------------
# study_code = "033534"   # only if you are enrolled in several curricula
# slot = "14:15"          # exam with time slots: text of the slot (default: first offered slot)
# cookies = "cookies.txt" # cookie file, relative to this config
# interval_ms = 200       # time between page reloads around the opening (one request at a time)
# window_s = 90           # give up this long after the opening
